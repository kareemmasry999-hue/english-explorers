<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#fff8ec">
<title>English Explorers</title>
<style>
:root{
  --bg:#fff8ec;--card:#ffffff;--ink:#1f2a44;--mute:#5d6b85;--line:#e8dfcf;
  --sky:#2f80ed;--sky2:#e6f0ff;--leaf:#1f9d63;--leaf2:#e1f6ec;--sun:#f2a900;--sun2:#fff1c9;
  --coral:#d9483b;--coral2:#fdecea;--sand:#f4efe6;--r:20px
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Roboto,"Noto Sans","Noto Sans Arabic",Tahoma,Arial,sans-serif;font-size:19px;line-height:1.5}
#app{max-width:560px;margin:0 auto;padding:14px 16px 110px}
h1{font-size:26px;line-height:1.25;margin:6px 0 4px}h2{font-size:21px;margin:0 0 8px}
p{margin:6px 0}.mute{color:var(--mute);font-size:16px}
[dir=rtl]{text-align:right}
.center [dir=rtl],.center[dir=rtl],.holiday [dir=rtl],.holiday{text-align:center}
.ar{font-size:19px;line-height:1.7}
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:16px;margin:14px 0}
button{font:inherit;color:inherit;cursor:pointer;border-radius:16px;border:2px solid var(--line);background:#fff;padding:14px 16px;min-height:56px;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:4px solid var(--sky);outline-offset:2px}
button:disabled{cursor:default}
.big{display:flex;align-items:center;gap:12px;width:100%;margin:10px 0;font-weight:700;font-size:21px;text-align:start}
.big .em{font-size:28px}
.primary{background:var(--sky);border-color:var(--sky);color:#fff;justify-content:center;text-align:center}
.primary:disabled{opacity:.6}
.go{background:var(--leaf);border-color:var(--leaf);color:#fff;justify-content:center}
.link{border:0;background:none;color:var(--sky);padding:8px 4px;min-height:44px;font-weight:600;text-decoration:underline}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.stars{background:var(--sun2);border:2px solid #f6d98a;border-radius:999px;padding:6px 14px;font-weight:800;white-space:nowrap;font-size:20px}
/* "What do I do now?" helper */
.hint{display:flex;gap:10px;align-items:flex-start;background:var(--sky2);border-radius:var(--r);padding:12px 14px;margin:10px 0 4px}
.hint .em{font-size:26px;line-height:1.2}
/* holiday + calendar */
.holiday{background:linear-gradient(135deg,#fff1c9,#ffe3b3);border:2px solid #f6c86a;border-radius:var(--r);padding:16px;margin:14px 0;text-align:center}
.holiday .huge{font-size:54px;margin:0}
.cal{list-style:none;margin:0;padding:0}
.cal li{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px dashed var(--line)}
.cal li:last-child{border-bottom:0}
.cal .em{font-size:24px;width:32px;text-align:center}
.cal .now{background:var(--sky2);border-radius:14px;border-bottom-color:transparent}
.cal .hol{background:var(--sun2);border-radius:14px;border-bottom-color:transparent}
.tag{display:inline-block;border-radius:999px;padding:1px 10px;font-size:14px;font-weight:700;background:var(--sky);color:#fff}
/* day tiles */
.days{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.day{padding:10px 6px;text-align:center;min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:15px}
.day .ic{font-size:30px}.day b{font-size:17px}
.day.open{border-color:var(--sky);background:var(--sky2)}
.day.done{border-color:var(--leaf);background:var(--leaf2)}
.day.locked,.day.soon{color:var(--mute);background:var(--sand)}
.wkstars{font-size:18px;letter-spacing:1px}
.badge{display:inline-block;background:var(--leaf2);color:#137a4b;border-radius:999px;padding:2px 10px;font-size:14px;font-weight:700}
/* progress */
.prog{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 6px}
.bar{height:14px;background:#efe6d6;border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--leaf);border-radius:999px;transition:width .3s}
.prog p{margin:4px 0 0;font-weight:700;font-size:17px}
/* task parts */
.q{margin:16px 0 8px;font-weight:700;font-size:20px}
.opts{display:grid;gap:10px}
.opt{text-align:start;font-size:20px}.opt.sel{border-color:var(--sky);background:var(--sky2);font-weight:700}
.opt.right{border-color:var(--leaf);background:var(--leaf2)}
.read{background:#fffdf3;border:2px solid #f0e3b0;border-radius:16px;padding:14px;font-size:21px;line-height:1.8}
.say{font-size:21px;margin:8px 0}
.arbox{background:#f3f6fc;border-radius:16px;padding:12px 16px}
.arbox ol{margin:4px 0;padding-inline-start:24px}
input[type=text]{font:inherit;font-size:22px;width:100%;padding:14px;border:2px solid var(--line);border-radius:14px;margin:6px 0;direction:ltr}
input[type=file]{font-size:16px;max-width:100%}
.words{font-size:30px;font-weight:800;letter-spacing:1px;text-align:center;margin:10px 0}
.ok{background:var(--leaf2);color:#0f6b40;border-radius:16px;padding:12px 14px;margin:10px 0;font-weight:700}
.warn{background:var(--coral2);color:#9c2a20;border-radius:16px;padding:12px 14px;margin:10px 0}
.key{background:var(--sun2);border-radius:16px;padding:12px 14px;margin:10px 0}
img.prev{max-width:100%;border-radius:14px;margin-top:8px}
audio{width:100%;margin-top:8px}
.center{text-align:center}.huge{font-size:72px;margin:8px 0}
.rec{background:var(--coral2);border-color:var(--coral)}
/* sticky send bar */
.sendbar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,248,236,.96);border-top:2px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.sendbar .in{max-width:560px;margin:0 auto}
.sendbar button{width:100%;margin:0}
/* "please wait" layer */
#wait{position:fixed;inset:0;background:rgba(255,248,236,.85);display:none;align-items:center;justify-content:center;z-index:50}
#wait.on{display:flex}
#wait .box{background:#fff;border:2px solid var(--line);border-radius:24px;padding:22px 28px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.08)}
.spin{width:52px;height:52px;border:6px solid var(--sky2);border-top-color:var(--sky);border-radius:50%;margin:0 auto 10px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}.bar i{transition:none}}
@media (max-width:360px){body{font-size:18px}h1{font-size:23px}.big{font-size:19px}.days{gap:8px}}
</style>
</head>
<body>
<div id="app"><div class="center"><div class="spin"></div><p class="ar" dir="rtl" lang="ar">استنى لحظة…</p></div></div>
<div id="wait" role="status" aria-live="polite"><div class="box"><div class="spin"></div><div class="ar" dir="rtl" lang="ar" id="waitTxt">استنى لحظة…</div></div></div>
<script>
var S = { cls: null, name: null, app: null, task: null, ans: {}, photo: '', voice: '', sending: false, cal: null };
var $app = document.getElementById('app');

var API = 'https://script.google.com/macros/s/AKfycby7aIhrav4YkOPte6hc9jN2qVtIT3K2zHPJMff-k0jSpHOO5U4qpXx6gLSfoYIMppgs/exec';

/* ---------- server calls (with a time limit so a weak connection never hangs forever) ---------- */
function call(fn) {
  var args = [].slice.call(arguments, 1), ms = fn === 'submit' ? 120000 : 45000;
  var ctl = window.AbortController ? new AbortController() : null, timer = null;
  if (ctl) timer = setTimeout(function () { ctl.abort(); }, ms);
  return fetch(API, { method: 'POST', body: JSON.stringify({ fn: fn, args: args }), signal: ctl ? ctl.signal : undefined })
    .then(function (r) { if (timer) clearTimeout(timer); return r.json(); }, function (e) { if (timer) clearTimeout(timer); throw e; })
    .then(function (j) { if (!j || !j.ok) { var e = new Error((j && j.error) || 'Server'); e.server = true; throw e; } return j.data; });
}
/* Friendly Arabic message: what happened + what to do. */
function friendly(e) {
  var m = String((e && e.message) || e || '');
  if (!navigator.onLine || /Failed to fetch|NetworkError|Load failed|network|abort/i.test(m) || (e && e.name === 'AbortError') || (e && e.name === 'TypeError'))
    return '📶 الإنترنت ضعيف أو مقطوع. تأكد من الواي فاي أو البيانات، ثم اضغط «حاول مرة ثانية».';
  if (/Unknown student/i.test(m)) return '🙂 ما لقينا اسمك. اختر فصلك واسمك من جديد.';
  if (/locked/i.test(m)) return '🔒 هذا اليوم لم يُفتح بعد. يفتح الساعة ٤ العصر.';
  if (/not ready|No audio|missing/i.test(m)) return '⏳ هذه المهمة غير جاهزة بعد. جرّب بعد قليل.';
  return '😕 صار خطأ بسيط. حاول مرة ثانية بعد قليل، وإذا تكرر أخبر أ. كريم.';
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function ar(html, cls) { return '<p class="ar ' + (cls || '') + '" dir="rtl" lang="ar">' + html + '</p>'; }
function hint(txt) { return '<div class="hint" dir="rtl" lang="ar"><span class="em" aria-hidden="true">💡</span><div class="ar"><b>ماذا أفعل الآن؟</b><br>' + txt + '</div></div>'; }
function wait(on, txt) { document.getElementById('waitTxt').textContent = txt || 'استنى لحظة…'; document.getElementById('wait').className = on ? 'on' : ''; }
function spinner() { return '<div class="center" style="margin-top:40px"><div class="spin"></div>' + ar('استنى لحظة…') + '</div>'; }
function store(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function load(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }
function remember() { store('ee_who', { cls: S.cls, name: S.name }); }
function recall() { return load('ee_who'); }
function forget() { store('ee_who', null); }
function fail(e, again) {
  $app.innerHTML = '<div class="center"><div class="huge">🙈</div></div><div class="warn" dir="rtl" lang="ar"><p class="ar">' + friendly(e) + '</p></div>' +
    '<button class="big primary" id="again"><span class="em">🔄</span> Try again · حاول مرة ثانية</button>';
  document.getElementById('again').onclick = again || start;
}
/* Arabic date, Gregorian calendar, e.g. «الاثنين ٣٠ نوفمبر» */
function arDate(ds, withDay) {
  if (!ds) return '';
  try { return new Date(ds + 'T12:00:00+03:00').toLocaleDateString('ar-EG', withDay === false ? { day: 'numeric', month: 'long', calendar: 'gregory', timeZone: 'Asia/Riyadh' } : { weekday: 'long', day: 'numeric', month: 'long', calendar: 'gregory', timeZone: 'Asia/Riyadh' }); }
  catch (e) { return ds; }
}
function n2a(n) { return String(n).replace(/\d/g, function (d) { return '٠١٢٣٤٥٦٧٨٩'[d]; }); }
var AR_WEEK = ['', 'الأول', 'الثاني', 'الثالث', 'الرابع', 'الخامس', 'السادس', 'السابع', 'الثامن', 'التاسع', 'العاشر'];

/* ---------- holiday + calendar ---------- */
function holidayBanner(cal) {
  var h = cal && cal.holidayNow; if (!h) return '';
  var back = h.back ? 'نرجع إن شاء الله يوم <b>' + esc(arDate(h.back)) + '</b> 🌟' : 'هنرجع قريباً 🌟';
  return '<div class="holiday" dir="rtl" lang="ar"><p class="huge" aria-hidden="true">🌴</p><h2 class="ar">' + esc(h.label) + '</h2>' +
    (h.msg ? '<p class="ar">' + esc(h.msg) + '</p>' : '<p class="ar">هذا الأسبوع إجازة، ولا توجد مهام جديدة.</p>') +
    '<p class="ar">' + back + '</p><p class="mute" dir="ltr" lang="en">Holiday week – no new tasks. Your stars are safe! ⭐</p></div>';
}
function calendarCard(cal) {
  if (!cal || !cal.weeks) return '';
  var items = [];
  cal.weeks.forEach(function (w) {
    var em = w.state === 'past' ? '✅' : w.state === 'current' ? '📍' : w.state === 'upcoming' ? '🗓️' : '⏳';
    var when = w.start ? esc(arDate(w.start, false)) + ' – ' + esc(arDate(w.end, false)) : 'الموعد: هنرجع قريباً';
    items.push({ k: w.start || ('9999-' + w.w), h: '<li class="' + (w.state === 'current' ? 'now' : '') + '"><span class="em" aria-hidden="true">' + em + '</span><div><b>الأسبوع ' + AR_WEEK[w.w] + '</b>' +
      (w.state === 'current' ? ' <span class="tag">هذا الأسبوع</span>' : '') + '<br><span class="mute">' + when + '</span></div></li>' });
  });
  (cal.holidays || []).forEach(function (h) {
    if (h.end && h.end < cal.today) return;
    var when = esc(arDate(h.start, false)) + (h.end ? ' – ' + esc(arDate(h.end, false)) : '');
    items.push({ k: h.start, h: '<li class="hol"><span class="em" aria-hidden="true">🌴</span><div><b>' + esc(h.label) + '</b>' + (h.now ? ' <span class="tag">الآن</span>' : '') + '<br><span class="mute">' + when + '</span></div></li>' });
  });
  items.sort(function (a, b) { return a.k < b.k ? -1 : a.k > b.k ? 1 : 0; });
  return '<div class="card" dir="rtl" lang="ar"><h2 class="ar">🗓️ التقويم</h2><ul class="cal">' + items.map(function (x) { return x.h; }).join('') + '</ul></div>';
}

/* ---------- login: class, then name (same as before) ---------- */
function start() {
  var who = recall();
  if (who && who.cls && who.name) { S.cls = who.cls; S.name = who.name; return loadHome(); }
  $app.innerHTML = spinner();
  call('getApp').then(function (d) { S.roster = d.roster; S.cal = d.calendar || null; pickClass(); }).catch(function (e) { fail(e); });
}
function pickClass() {
  var h = '<h1>English Explorers 🌟</h1>' + hint('اختر فصلك من الأزرار تحت.') + holidayBanner(S.cal) + '<p><b>Choose your class</b></p>';
  Object.keys(S.roster).forEach(function (c) { h += '<button class="big" data-c="' + esc(c) + '"><span class="em" aria-hidden="true">🏫</span><span dir="ltr">' + esc(c) + '</span></button>'; });
  $app.innerHTML = h; window.scrollTo(0, 0);
  [].forEach.call($app.querySelectorAll('[data-c]'), function (b) { b.onclick = function () { S.cls = b.dataset.c; pickName(); }; });
}
function pickName() {
  var h = '<button class="link" id="back">← Back · رجوع</button><h1 dir="ltr">' + esc(S.cls) + '</h1>' + hint('اضغط على اسمك.') + '<p><b>Tap your name</b></p>';
  S.roster[S.cls].forEach(function (n) { h += '<button class="big" data-n="' + esc(n) + '"><span class="em" aria-hidden="true">🙂</span><span dir="ltr">' + esc(n) + '</span></button>'; });
  $app.innerHTML = h; window.scrollTo(0, 0);
  document.getElementById('back').onclick = pickClass;
  [].forEach.call($app.querySelectorAll('[data-n]'), function (b) { b.onclick = function () { S.name = b.dataset.n; remember(); loadHome(); }; });
}
function switchUser() { forget(); S.cls = S.name = null; start(); }

/* ---------- home ---------- */
function loadHome() {
  $app.innerHTML = spinner();
  call('getApp', S.cls, S.name).then(function (d) { S.app = d; S.cal = d.calendar || null; home(); })
    .catch(function (e) { if (/Unknown student/i.test(String(e && e.message))) forget(); fail(e, loadHome); });
}
function badge(n) { return n >= 10 ? 'Star Explorer' : n >= 8 ? 'Super Effort' : n >= 6 ? 'English Explorer' : ''; }
function starRow(n) { var s = ''; for (var i = 0; i < 10; i++) s += i < n ? '⭐' : '<span style="opacity:.25">☆</span>'; return s; }
function home() {
  var a = S.app, cal = a.calendar;
  var openToDo = [], cur = null;
  a.weeks.forEach(function (w) { w.days.forEach(function (d) { if (d.status === 'open' && !d.done) openToDo.push(d); }); });
  if (cal) cal.weeks.forEach(function (w) { if (w.state === 'current') cur = w.w; });
  var tip;
  if (cal && cal.holidayNow) tip = 'هذا الأسبوع إجازة 🌴 ما فيه مهام جديدة. تقدر تشوف نجومك وتعيد أي مهمة قديمة للتدريب.';
  else if (openToDo.length) tip = 'عندك <b>' + n2a(openToDo.length) + '</b> ' + (openToDo.length === 1 ? 'مهمة' : 'مهام') + ' لم ترسلها بعد. اضغط على المربع الأزرق ▶️ وابدأ.';
  else tip = 'أحسنت! أرسلت كل المهام المفتوحة ✅ المهمة الجديدة تفتح الساعة ٤ العصر.';

  var h = '<div class="top"><h1>Hi, <span dir="ltr">' + esc(a.name.split(' ')[0]) + '</span>! 👋</h1><span class="stars" aria-label="' + a.total + ' stars">⭐ ' + a.total + '</span></div>' +
    '<p class="mute"><span dir="ltr">' + esc(a.name) + ' · ' + esc(a.cls) + '</span> · <button class="link" id="sw">Not you? · لست أنت؟</button></p>' +
    hint(tip) + holidayBanner(cal);

  // Weeks: newest first, so the current week is at the top. Weeks without dates are shown in the calendar only.
  var weeks = a.weeks.slice().filter(function (w) {
    return w.days.some(function (d) { return d.status !== 'locked' || d.done; }) || (cal && cal.weeks[w.w - 1] && cal.weeks[w.w - 1].state === 'current');
  }).reverse();
  weeks.forEach(function (w) {
    var b = badge(w.stars), sent = w.days.filter(function (d) { return d.done; }).length;
    h += '<div class="card"><div class="top"><h2>Week ' + w.w + (w.w === cur ? ' <span class="tag">هذا الأسبوع</span>' : '') + '</h2>' + (b ? '<span class="badge">🏅 ' + b + '</span>' : '') + '</div>' +
      '<p class="wkstars" aria-label="' + w.stars + ' of 10 stars">' + starRow(w.stars) + ' <b>' + w.stars + '/10</b></p>' +
      ar('أرسلت ' + n2a(sent) + ' من ٤ مهام', 'mute') + '<div class="days">';
    w.days.forEach(function (d) {
      var cls = d.status === 'open' ? (d.done ? 'done' : 'open') : d.status;
      var ic = d.why === 'holiday' ? '🌴' : d.status === 'locked' ? '🔒' : d.status === 'soon' ? '⏳' : d.done ? '✅' : (d.task.icon || '▶️');
      var sub = d.status === 'open' ? esc(d.task.title) : d.why === 'holiday' ? 'إجازة' : d.status === 'soon' ? 'Coming soon' : esc(d.label);
      h += '<button class="day ' + cls + '" data-d="' + d.id + '"' + (d.status === 'open' ? '' : ' disabled') + '><span class="ic" aria-hidden="true">' + ic + '</span><b>Day ' + d.id.slice(-1) + '</b><span>' + sub + '</span></button>';
    });
    h += '</div></div>';
  });
  h += calendarCard(cal);
  h += '<div class="card mute" dir="rtl" lang="ar"><p class="ar">🕓 المهمة الجديدة تفتح الساعة ٤ العصر.</p><p class="ar">🐦 أرسل قبل الساعة ٨ مساءً لتحصل على نجمة «<bdi dir="ltr">Early Bird</bdi>».</p></div>';
  $app.innerHTML = h;
  document.getElementById('sw').onclick = switchUser;
  [].forEach.call($app.querySelectorAll('.day:not([disabled])'), function (b) { b.onclick = function () { openTask(b.dataset.d); }; });
  window.scrollTo(0, 0);
}
function findDay(id) { var r = null; S.app.weeks.forEach(function (w) { w.days.forEach(function (d) { if (d.id === id) r = d; }); }); return r; }

/* ---------- task ---------- */
function draftKey() { return 'ee_draft_' + S.cls + '_' + S.name + '_' + S.task.id; }
function saveDraft() { store(draftKey(), { ans: S.ans, at: Date.now() }); }
function openTask(id) {
  var d = findDay(id), t = d.task; S.task = d; S.ans = {}; S.photo = ''; S.voice = ''; S.sending = false;
  var dr = load(draftKey()); if (dr && dr.ans) S.ans = dr.ans;
  var h = '<button class="link" id="back">← Back · رجوع</button>' +
    '<div class="prog" id="prog"></div>' +
    '<h1>' + (t.icon || '') + ' ' + esc(t.title) + '</h1><p class="mute">' + id + ' · about ' + t.minutes + ' minutes</p>' +
    hint('اعمل الخطوات بالترتيب من فوق لتحت. لما تخلص اضغط الزر الأخضر «<bdi dir="ltr">Send my work</bdi>» تحت.');
  if (d.done) h += '<div class="ok" dir="rtl" lang="ar">✅ أرسلت هذه المهمة من قبل. تقدر تعيدها للتدريب.</div>';
  if (dr && dr.ans && Object.keys(dr.ans).length) h += '<div class="ok" dir="rtl" lang="ar">💾 رجّعنا إجاباتك المكتوبة المحفوظة في الجوال.</div>';
  if (t.ar) h += '<div class="arbox" dir="rtl" lang="ar"><b>📝 شرح المهمة:</b><ol>' + t.ar.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ol></div>';
  if (t.audio) h += '<div class="card"><h2>🎧 Listen</h2><button class="big primary" id="play"><span class="em">▶</span> Play the audio</button><div id="aud"></div>' + ar('تقدر تسمع أكثر من مرة.', 'mute') + '</div>';
  t.steps.forEach(function (s, i) {
    if (s.type === 'mcq') {
      h += '<div class="q">' + esc(s.q) + '</div><div class="opts">';
      s.opts.forEach(function (o, j) {
        var right = d.keyOpen && s.ans === j, sel = S.ans[i] === j;
        h += '<button class="opt' + (right ? ' right' : '') + (sel ? ' sel' : '') + '" data-i="' + i + '" data-j="' + j + '">' + esc(o) + (right ? ' ✔️' : '') + '</button>';
      });
      h += '</div>';
    } else if (s.type === 'read') h += '<div class="card"><h2>📖 Read</h2><div class="read">' + esc(s.text) + '</div></div>';
    else if (s.type === 'say') h += '<div class="card"><h2>🗣️ Listen and say</h2>' + s.lines.map(function (l) { return '<div class="say">' + esc(l) + '</div>'; }).join('') + '</div>';
    else if (s.type === 'spell') {
      var typed = Array.isArray(S.ans[i]) && S.ans[i].some(function (x) { return x; });
      h += '<div class="card"><h2>🔤 Spell from memory</h2><div id="sp' + i + '">' + (typed ? '' : '<p>Look 👀 and say 🗣️ the words:</p><div class="words">' + s.words.map(esc).join(' · ') + '</div>' +
        ar('انظر للكلمات وقلها، ثم اضغط «<bdi dir="ltr">Cover and write</bdi>» واكتبها بدون ما تشوفها.', 'mute') + '<button class="big primary" data-cover="' + i + '"><span class="em">✋</span> Cover and write</button>') + '</div></div>';
    }
    else if (s.type === 'write') h += '<div class="card"><h2>✍️ Write</h2><p>' + esc(s.prompt) + '</p>' + ar('اكتب في الدفتر، ثم صوّر الكتابة.', 'mute') + '<input type="file" accept="image/*" id="photo" aria-label="Photo of your writing"><div id="pprev"></div></div>';
    else if (s.type === 'speak') h += '<div class="card"><h2>🗣️ Speak</h2><p>' + esc(s.prompt) + '</p>' + (s.example ? '<p class="mute">Example: “' + esc(s.example) + '”</p>' : '') +
      '<button class="big" id="rec"><span class="em">🎙️</span> Record my voice</button><div id="vprev"></div>' + ar('إذا ما اشتغل التسجيل، أرسلوا التسجيل الصوتي لأ. كريم على الواتساب.', 'mute') + '</div>';
  });
  if (d.keyOpen && (t.model || t.fix || t.check)) h += '<div class="key"><b>✅ Answers</b>' + (t.model ? '<p>Possible answer: “' + esc(t.model) + '”</p>' : '') + (t.check ? '<p>Check: ' + esc(t.check) + '</p>' : '') + (t.fix ? '<p>🔁 Fix it: ' + esc(t.fix) + '</p>' : '') + '</div>';
  h += '<div id="msg" aria-live="polite"></div>';
  h += '<div class="sendbar"><div class="in"><button class="big go" id="send"><span class="em">📤</span> Send my work · أرسل</button></div></div>';
  $app.innerHTML = h; window.scrollTo(0, 0);
  document.getElementById('back').onclick = function () { if (!S.sending) home(); };

  [].forEach.call($app.querySelectorAll('.opt'), function (b) {
    b.onclick = function () {
      S.ans[b.dataset.i] = +b.dataset.j; saveDraft();
      [].forEach.call($app.querySelectorAll('.opt[data-i="' + b.dataset.i + '"]'), function (x) { x.classList.toggle('sel', x === b); });
      progress();
    };
  });
  [].forEach.call($app.querySelectorAll('[data-cover]'), function (b) { b.onclick = function () { cover(+b.dataset.cover); }; });
  t.steps.forEach(function (s, i) { if (s.type === 'spell' && Array.isArray(S.ans[i]) && S.ans[i].some(function (x) { return x; })) cover(i); });
  var play = document.getElementById('play');
  if (play) play.onclick = function () {
    play.disabled = true; play.innerHTML = '<span class="em">⏳</span> <span dir="rtl" lang="ar">استنى لحظة…</span>';
    call('getAudio', id).then(function (src) {
      document.getElementById('aud').innerHTML = '<audio controls src="' + src + '"></audio>';
      play.style.display = 'none';
      var au = $app.querySelector('#aud audio'); if (au && au.play) { var p = au.play(); if (p && p.catch) p.catch(function () {}); }
    }).catch(function (e) { play.disabled = false; play.innerHTML = '<span class="em">▶</span> Play the audio'; document.getElementById('aud').innerHTML = '<div class="warn" dir="rtl" lang="ar">' + friendly(e) + '</div>'; });
  };
  var ph = document.getElementById('photo');
  if (ph) ph.onchange = function () {
    if (!ph.files[0]) return;
    wait(true, 'استنى لحظة… نجهّز الصورة');
    shrink(ph.files[0]).then(function (u) { wait(false); S.photo = u; document.getElementById('pprev').innerHTML = '<img class="prev" alt="Your writing" src="' + u + '"><p class="ok" dir="rtl" lang="ar">📷 الصورة جاهزة</p>'; progress(); });
  };
  var rec = document.getElementById('rec'); if (rec) rec.onclick = function () { toggleRec(rec); };
  document.getElementById('send').onclick = function () { send(false); };
  progress();
}
function cover(i) {
  var s = S.task.task.steps[i]; if (!Array.isArray(S.ans[i])) S.ans[i] = s.words.map(function () { return ''; });
  document.getElementById('sp' + i).innerHTML = '<p>Now write the ' + s.words.length + ' words:</p>' + s.words.map(function (w, j) {
    return '<input type="text" dir="ltr" lang="en" aria-label="Word ' + (j + 1) + '" placeholder="Word ' + (j + 1) + '" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" data-si="' + i + '" data-sj="' + j + '" value="' + esc(S.ans[i][j] || '') + '">'; }).join('');
  [].forEach.call($app.querySelectorAll('[data-si="' + i + '"]'), function (inp) { inp.oninput = function () { S.ans[i][+inp.dataset.sj] = inp.value; saveDraft(); progress(); }; });
}
/* Items the child has to do in this task, and how many are done. */
function todo() {
  var t = S.task.task, items = [];
  t.steps.forEach(function (s, i) {
    if (s.type === 'mcq') items.push(S.ans[i] !== undefined && S.ans[i] !== null);
    else if (s.type === 'spell') items.push(Array.isArray(S.ans[i]) && S.ans[i].every(function (x) { return String(x || '').trim(); }));
    else if (s.type === 'write') items.push(!!S.photo);
    else if (s.type === 'speak') items.push(!!S.voice);
  });
  return { total: items.length, done: items.filter(Boolean).length };
}
function progress() {
  var el = document.getElementById('prog'); if (!el) return;
  var p = todo(); if (!p.total) { el.innerHTML = ''; return; }
  var left = p.total - p.done, pct = Math.round(100 * p.done / p.total);
  el.innerHTML = '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="' + p.total + '" aria-valuenow="' + p.done + '"><i style="width:' + pct + '%"></i></div>' +
    '<p dir="rtl" lang="ar" class="ar">' + (left ? '✏️ باقي ' + n2a(left) + ' من ' + n2a(p.total) : '🎉 خلصت كل الخطوات! اضغط «<bdi dir="ltr">Send my work</bdi>»') + '</p>';
}

function toDataUrl(blob) { return new Promise(function (res) { var r = new FileReader(); r.onload = function () { res(r.result); }; r.readAsDataURL(blob); }); }
function shrink(file) {
  return new Promise(function (res) {
    var img = new Image(), url = URL.createObjectURL(file);
    img.onload = function () {
      var k = Math.min(1, 1400 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.8));
    };
    img.onerror = function () { toDataUrl(file).then(res); };
    img.src = url;
  });
}
function setVoice(u) { S.voice = u; document.getElementById('vprev').innerHTML = '<audio controls src="' + u + '"></audio><p class="ok" dir="rtl" lang="ar">🎙️ التسجيل جاهز</p>'; progress(); }
var R = null;
function toggleRec(btn) {
  if (R) { R.stop(); return; }
  if (!navigator.mediaDevices || !window.MediaRecorder) { document.getElementById('vprev').innerHTML = '<div class="warn" dir="rtl" lang="ar">🎙️ التسجيل غير متاح في هذا الجوال. أرسل التسجيل الصوتي لأ. كريم على الواتساب.</div>'; return; }
  navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
    var chunks = []; R = new MediaRecorder(stream);
    R.ondataavailable = function (e) { if (e.data.size) chunks.push(e.data); };
    R.onstop = function () {
      stream.getTracks().forEach(function (t) { t.stop(); });
      var type = (R.mimeType || 'audio/webm').split(';')[0]; R = null;
      btn.classList.remove('rec'); btn.innerHTML = '<span class="em">🎙️</span> Record again';
      toDataUrl(new Blob(chunks, { type: type })).then(function (u) { setVoice(u.replace(/^data:[^,]*;base64,/, 'data:' + type + ';base64,')); });
    };
    R.start(); btn.classList.add('rec'); btn.innerHTML = '<span class="em">⏹</span> Stop recording · إيقاف';
    setTimeout(function () { if (R && R.state === 'recording') R.stop(); }, 60000);
  }).catch(function () { document.getElementById('vprev').innerHTML = '<div class="warn" dir="rtl" lang="ar">🎙️ المايك مقفل. اسمح للموقع باستخدام المايك، أو أرسل التسجيل على الواتساب.</div>'; });
}

/* ---------- send: one tap only; «تم الإرسال» appears only after the server confirms ---------- */
function send(force) {
  if (S.sending) return;
  var t = S.task.task, miss = [];
  t.steps.forEach(function (s, i) {
    if (s.type === 'mcq' && S.ans[i] === undefined && miss.indexOf('جاوب كل الأسئلة') < 0) miss.push('جاوب كل الأسئلة');
    if (s.type === 'spell' && !(S.ans[i] || []).some(function (x) { return x; })) miss.push('اكتب كلمات الإملاء');
    if (s.type === 'write' && !S.photo) miss.push('أضف صورة الكتابة');
  });
  var msg = document.getElementById('msg');
  if (miss.length && !force) {
    msg.innerHTML = '<div class="warn" dir="rtl" lang="ar"><p class="ar">✋ ما خلصت بعد. باقي: ' + miss.join('، ') + '.</p><button class="link" id="anyway">أرسل كذا (<bdi dir="ltr">Send anyway</bdi>)</button></div>';
    document.getElementById('anyway').onclick = function () { send(true); };
    msg.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }
  S.sending = true;
  var btn = document.getElementById('send'); btn.disabled = true; btn.innerHTML = '<span class="em">⏳</span> <span dir="rtl" lang="ar">استنى لحظة… جاري الإرسال</span>'; msg.innerHTML = '';
  wait(true, 'استنى لحظة… جاري الإرسال. لا تقفل الصفحة.');
  saveDraft();
  call('submit', { cls: S.cls, name: S.name, taskId: S.task.id, answers: S.ans, photo: S.photo, voice: S.voice }).then(function (r) {
    wait(false); S.sending = false;
    if (!r || r.ok !== true) throw new Error('Server');
    store(draftKey(), null);
    $app.innerHTML = '<div class="center"><div class="huge">🌟</div><h1 dir="rtl" lang="ar">✅ تم الإرسال</h1><h2>Well done, <span dir="ltr">' + esc(S.name.split(' ')[0]) + '</span>!</h2><p>Your work is sent to Mr. Kareem.</p>' +
      '<p class="stars" style="display:inline-block">⭐ Star for finishing' + (r.early ? ' + ⭐ Early Bird' : '') + '</p>' + ar('أحسنت! وصل عملك لأ. كريم.') + '</div>' +
      hint('ارجع لأيامك وشوف نجومك ⭐') + '<button class="big primary" id="home"><span class="em">🏠</span> Back to my days · رجوع</button>';
    document.getElementById('home').onclick = loadHome; window.scrollTo(0, 0);
  }).catch(function (e) {
    wait(false); S.sending = false;
    btn.disabled = false; btn.innerHTML = '<span class="em">🔄</span> Try again · حاول مرة ثانية';
    msg.innerHTML = '<div class="warn" dir="rtl" lang="ar"><p class="ar"><b>لم يتم الإرسال.</b> ' + friendly(e) + '</p>' +
      '<p class="ar">💾 إجاباتك المكتوبة محفوظة في الجوال.' + ((S.photo || S.voice) ? ' الصورة والتسجيل محفوظين فقط ما دامت هذه الصفحة مفتوحة، فلا تقفلها.' : '') + '</p></div>';
    msg.scrollIntoView({ behavior: 'smooth', block: 'center' });
  });
}
window.addEventListener('offline', function () { var m = document.getElementById('msg'); if (m && !S.sending) m.innerHTML = '<div class="warn" dir="rtl" lang="ar">📶 انقطع الإنترنت. إجاباتك محفوظة، أرسل لما يرجع الاتصال.</div>'; });
start();
</script>
